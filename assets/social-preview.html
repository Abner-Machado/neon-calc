<!doctype html>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1280px; height:640px; }
  body {
    background:#05070d; color:#e8f4ff;
    font-family:"Segoe UI", system-ui, sans-serif;
    display:flex; align-items:center; gap:70px;
    padding:0 90px; position:relative; overflow:hidden;
  }
  .aurora {
    position:absolute; inset:0;
    background:
      radial-gradient(34vw 34vw at 12% 30%, rgba(53,230,255,.20), transparent 62%),
      radial-gradient(30vw 30vw at 78% 74%, rgba(155,108,255,.20), transparent 62%);
    filter: blur(10px);
  }
  .grade {
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(53,230,255,.09) 1px, transparent 1px),
      linear-gradient(90deg, rgba(53,230,255,.09) 1px, transparent 1px);
    background-size:52px 52px;
    mask-image: linear-gradient(transparent 40%, #000 92%);
    transform: perspective(500px) rotateX(66deg) translateY(26%) scale(2);
    transform-origin: bottom;
  }
  .copy { position:relative; flex:1; }
  h1 { font-size:70px; font-weight:700; letter-spacing:-2.5px; line-height:1; }
  .fio { width:104px; height:5px; border-radius:3px; margin:24px 0 22px;
         background:linear-gradient(90deg,#35e6ff,#9b6cff); }
  p { font-size:29px; line-height:1.34; color:#a9bed4; }
  .marca { font-size:20px; color:#8ea4bd; letter-spacing:.6px; margin-top:34px; }
  .shot { position:relative; flex:none; height:560px; }
  .shot img {
    height:100%; display:block;
    filter: drop-shadow(0 26px 60px rgba(0,0,0,.75)) drop-shadow(0 0 46px rgba(53,230,255,.18));
  }
</style>
<div class="aurora"></div>
<div class="grade"></div>

<div class="copy">
  <h1>neon-calc</h1>
  <div class="fio"></div>
  <p>Calculadora de arquivo único.<br>Quando a conta não tem resposta<br>possível, o visor responde.</p>
  <div class="marca">HTML, CSS e JavaScript puro · sem dependência · abre offline</div>
</div>

<div class="shot"><img src="calc-shot-crop.png" alt=""></div>
